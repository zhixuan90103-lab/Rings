<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关卡编辑</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="page-editor">
    <aside id="editor-desk" aria-label="关卡编辑">
      <div class="desk-head">
        <a href="./index.html">返回试玩</a>
      </div>
      <p id="status" class="status"></p>
      <div class="row" id="levels"></div>
      <div id="editor" class="editor"></div>
    </aside>

    <div id="shell">
      <div id="viewport">
        <div id="app">
          <div id="stage" aria-label="game-stage">
            <div id="ui-root">
              <header class="hud">
                <div class="hud-level">
                  <span class="hud-level-label">关卡</span>
                  <span id="hud-level" class="hud-level-num">1</span>
                </div>
                <div id="hud-counter" class="hud-counter">0</div>
                <span></span>
              </header>
              <div id="result" class="result" hidden>
                <div class="result-card" role="dialog" aria-labelledby="result-title">
                  <p id="result-title" class="result-title">恭喜过关</p>
                  <div class="result-actions">
                    <button type="button" id="result-replay">重玩</button>
                    <button type="button" id="result-next">下一关</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="device-switcher" aria-label="device-viewport-switcher">
      <button type="button" data-device="phone">手机竖屏</button>
      <button type="button" data-device="pad">Pad 竖屏</button>
    </div>
    <div id="device-label"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
